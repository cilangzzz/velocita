name: velocita
description: "Velocita — Flutter-native download manager."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Velocita kernel (pure Dart)
  velocita_kernel:
    path: ../packages/velocita_kernel

  # State management (M1 uses riverpod v2 - v3 not yet stable at M1 cutoff)
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Desktop window
  window_manager: ^0.3.9

  # System tray
  system_tray: ^2.0.3

  # Deep links
  app_links: ^6.3.2

  # Logging
  logging: ^1.3.0

  # Filesystem paths (data + downloads)
  path_provider: ^2.1.4

  # Synchronization primitives
  synchronized: ^3.3.0

  # Multi-window: lets us open the Add Task dialog in its own
  # OS-level window (independent Flutter engine) so the main app
  # can stay in the tray while a dialog floats alone, and so N
  # dialogs can exist in parallel.
  desktop_multi_window: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.png
    - assets/tray_icon.ico
    - assets/extensions/chrome/manifest.json
    - assets/extensions/chrome/background.js
    - assets/extensions/chrome/content/main.js
    - assets/extensions/chrome/content/sniffer.js
    - assets/extensions/chrome/popup.html
    - assets/extensions/chrome/popup.js
    - assets/extensions/chrome/options.html
    - assets/extensions/chrome/options.js
    - assets/extensions/chrome/icons/
    - assets/extensions/edge/manifest.json
    - assets/extensions/edge/background.js
    - assets/extensions/edge/content/main.js
    - assets/extensions/edge/content/sniffer.js
    - assets/extensions/edge/popup.html
    - assets/extensions/edge/popup.js
    - assets/extensions/edge/options.html
    - assets/extensions/edge/options.js
    - assets/extensions/edge/icons/
    - assets/extensions/firefox/manifest.json
    - assets/extensions/firefox/background.js
    - assets/extensions/firefox/content/main.js
    - assets/extensions/firefox/content/sniffer.js
    - assets/extensions/firefox/popup.html
    - assets/extensions/firefox/popup.js
    - assets/extensions/firefox/options.html
    - assets/extensions/firefox/options.js
    - assets/extensions/firefox/icons/
