<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Velocita — Settings</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
        margin: 0;
        padding: 20px;
        max-width: 480px;
      }
      h1 { font-size: 18px; margin: 0 0 12px; }
      label { display: block; margin: 12px 0 4px; font-size: 13px; }
      input[type="number"] {
        width: 100px;
        padding: 6px 8px;
        border: 1px solid #8885;
        border-radius: 4px;
        font-size: 13px;
      }
      .row { display: flex; align-items: center; gap: 8px; }
      .row label { margin: 0; }
      .hint { font-size: 11px; color: #888; }
      button {
        margin-top: 16px;
        padding: 6px 12px;
        background: #1f6feb;
        color: white;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Velocita Settings</h1>
    <label>Host (loopback IP)</label>
    <input type="text" id="host" placeholder="127.0.0.1" />

    <label>Port</label>
    <input type="number" id="port" min="1024" max="65535" />
    <div class="hint">Must match the port Velocita is listening on (default 16800).</div>

    <div class="row" style="margin-top: 16px;">
      <input type="checkbox" id="autoAdd" />
      <label for="autoAdd">Auto-add (skip the Velocita confirmation dialog)</label>
    </div>
    <div class="hint">
      When on, the extension adds downloads to the queue directly.
      This is a per-extension setting and does not change the
      Velocita "show confirmation" toggle in the desktop app.
    </div>

    <button id="save">Save</button>
    <span class="hint" id="status"></span>

    <script src="options.js"></script>
  </body>
</html>
